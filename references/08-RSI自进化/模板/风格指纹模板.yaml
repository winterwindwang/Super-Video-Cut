# 风格指纹模板 · sfp-v1
# 用法：复制本文件到 案例库/<CASE-ID>/风格指纹.yaml 后填写。
# 规则：只填经 G 过滤器标为 transferable 的参数；低置信度条目只能放 hypotheses。
# 每个参数建议采用 { value, evidence, confidence, source, note } 结构。
# 校验：见 ../03-风格指纹规范.md 的 V1–V8。

sfp_version: sfp-v1
id: SFP-YYYYMMDD-NNN
created: YYYY-MM-DD
source_case: CASE-YYYYMMDD-NNN

reference:
  title: ""
  duration_s: 0
  platform: ""
  genre: ""                       # 对应 ../04-分类型剪辑/ 哪一册
  probe_log: ""                   # 案例库/<CASE-ID>/probe.log
  assessment: ""                  # 案例库/<CASE-ID>/评估表.md

evidence_summary:
  e1_ratio: 0.0                   # 客观证据条目占比
  e3_count: 0                     # 解释性推断条数
  low_confidence_count: 0
  overall_confidence: 中          # 高 / 中 / 低

# ---------- A 剪辑手法 ----------
edit:
  shot_median_s:       { value: 0, evidence: E1, confidence: 中, source: "A1", note: "" }
  shot_p90_s:          { value: 0, evidence: E1, confidence: 中, source: "A1", note: "" }
  cut_density_per_min: { value: 0, evidence: E1, confidence: 中, source: "A2", note: "" }
  density_curve:       { value: [], evidence: E1, confidence: 中, source: "A2", note: "每 1/4 段 cuts/min" }
  cut_anchor_distribution:
    value: { action: 0, dialogue_break: 0, beat: 0, other: 0 }
    evidence: E1+E2
    confidence: 中
    source: "A3"
    note: ""
  transition_mix:
    value: { hard_cut: 0, dissolve: 0, wipe: 0, match: 0 }
    evidence: E2
    confidence: 中
    source: "A4"
    note: ""
  dissolve_frames:     { value: 0, evidence: E2, confidence: 中, source: "A4", note: "" }
  scale_progression:   { value: "", evidence: E2, confidence: 中, source: "A5", note: "" }
  camera_motion:       { value: "", evidence: E2, confidence: 中, source: "A6", note: "" }
  jl_cut_frames:       { value: [], evidence: E2, confidence: 中, source: "A7", note: "[最小, 最大]" }
  broll_ratio:         { value: 0, evidence: E2, confidence: 中, source: "A8", note: "" }
  beat_align_frame_error: { value: 0, evidence: E1+E2, confidence: 中, source: "A9", note: "" }
  fps:                 { value: 0, evidence: E1, confidence: 高, source: "A10 / ffprobe", note: "" }
  slowmo_segments:     { value: [], evidence: E2, confidence: 中, source: "A10", note: "" }

# ---------- B 音效与声音设计 ----------
audio:
  bpm:                 { value: 0, evidence: E2, confidence: 中, source: "B1", note: "" }
  mood:                { value: "", evidence: E3, confidence: 低, source: "B1", note: "推断，仅供参考" }
  music_in_s:          { value: 0, evidence: E2, confidence: 中, source: "B2", note: "" }
  drop_align_s:        { value: 0, evidence: E2, confidence: 中, source: "B2", note: "" }
  voice_type:          { value: "", evidence: E2, confidence: 中, source: "B3", note: "" }
  speech_ratio:        { value: 0, evidence: E2, confidence: 中, source: "B3", note: "" }
  sfx_per_10s:         { value: 0, evidence: E2, confidence: 中, source: "B4", note: "" }
  sfx_types:           { value: [], evidence: E2, confidence: 中, source: "B4", note: "" }
  sfx_cut_coupling:    { value: 0, evidence: E1+E2, confidence: 中, source: "B5", note: "" }
  music_duck_db:       { value: 0, evidence: E2, confidence: 中, source: "B6", note: "" }
  integrated_lufs:     { value: 0, evidence: E1, confidence: 高, source: "B7 / ebur128 Summary", note: "" }
  true_peak_dbtp:      { value: 0, evidence: E1, confidence: 高, source: "B7", note: "" }
  sound_bridge:        { value: false, evidence: E2, confidence: 中, source: "B8", note: "" }
  intentional_silence: { value: [], evidence: E1+E2, confidence: 中, source: "B9", note: "已人工确认刻意" }
  playback_target:     { value: "", evidence: E3, confidence: 中, source: "B10", note: "" }

# ---------- C 场景与画面 ----------
scene:
  count:               { value: 0, evidence: E2, confidence: 中, source: "C1", note: "" }
  duration_dist:       { value: [], evidence: E2, confidence: 中, source: "C2", note: "秒" }
  composition:         { value: "", evidence: E2, confidence: 中, source: "C3", note: "" }
  camera_height:       { value: "", evidence: E2, confidence: 中, source: "C4", note: "" }
  lighting_key:        { value: "", evidence: E2, confidence: 中, source: "C5", note: "" }
  color_temp:          { value: "", evidence: E2, confidence: 中, source: "C5", note: "" }
  yavg:                { value: 0, evidence: E1, confidence: 高, source: "C6 / signalstats", note: "" }
  satavg:              { value: 0, evidence: E1, confidence: 中, source: "C6", note: "" }
  motion_level:        { value: "", evidence: E2, confidence: 中, source: "C7", note: "" }
  aspect:              { value: "", evidence: E1, confidence: 高, source: "C8 / ffprobe", note: "" }
  safe_area:           { value: "", evidence: E2, confidence: 中, source: "C8", note: "平台经验值，待核实" }
  on_screen_elements:  { value: "", evidence: E2, confidence: 中, source: "C9", note: "结构可迁移，具体图形不可" }
  narrative_role_ratio:
    value: { setup: 0, build: 0, turn: 0, payoff: 0 }
    evidence: E3
    confidence: 低
    source: "C10"
    note: "推断"
  non_transferable:    { value: [], evidence: E2, confidence: 高, source: "C 特别说明", note: "内容层，禁止迁移" }

# ---------- D/E/F 扩展 ----------
caption:
  lines:               { value: 0, evidence: E2, confidence: 中, source: "D", note: "" }
  chars_per_line:      { value: 0, evidence: E2, confidence: 中, source: "D", note: "" }
  lead_in_frames:      { value: 0, evidence: E2, confidence: 中, source: "D", note: "" }
  on_screen_text_role: { value: "", evidence: E2, confidence: 中, source: "D", note: "" }

narrative:
  structure:           { value: [], evidence: E3, confidence: 中, source: "E", note: "推断" }
  emotional_curve:     { value: [], evidence: E3, confidence: 低, source: "E", note: "主观标注" }

context:
  aspect:              { value: "", evidence: E1, confidence: 高, source: "F", note: "" }
  hook:                { value: "", evidence: E2, confidence: 中, source: "F", note: "" }
  loudness_policy:     { value: "", evidence: E1, confidence: 高, source: "F/B7", note: "平台规格需回查" }
  playback_environment: { value: "", evidence: E3, confidence: 中, source: "F", note: "" }

# ---------- G 强制 ----------
constraints:
  principle: "思想与表达二分法：只迁移参数与结构，不迁移表达"
  protected_items: []              # 必填非空：原片台词 / 音乐 / 花字 / 镜头调度 / 造型
  transferable_scope: []           # 必填非空：节奏参数 / 结构比例 / 响度目标 / 色彩倾向 / 字幕参数
  forbidden_actions:               # 必填非空
    - "截帧复用"
    - "音轨翻录"
    - "镜头逐帧复刻"
    - "去除或遮盖水印与权利管理信息"
  legal_review_required: false
  note: "创作流程约束，不构成法律意见；商用项目须法务复核"

# ---------- 派生规则（驱动剪辑） ----------
derived_rules: []
# - id: R-001
#   when: "segment == opening && duration <= 3s"
#   apply: "shot_len in [0.8, 1.2] s, cut_count == 3"
#   priority: 高
#   weight: 0.8
#   basis: "A1/A2"
#   status: active          # active | candidate | retired

# ---------- 假设区（不参与硬约束） ----------
hypotheses: []
# - id: H-001
#   statement: ""
#   evidence: E3
#   confidence: 低
#   test: "再取同品类 3 条视频比对"

# 校验命令（需 Python + PyYAML）：
# python -c "import yaml,sys;d=yaml.safe_load(open(sys.argv[1],encoding='utf-8'));assert d['sfp_version']=='sfp-v1';print('OK')" 风格指纹.yaml

# mdc-v1 · Material Description Card (blank template)
# Usage: copy this file → fill in each item per 01-material-description-card-spec.md → validate → register
# Convention: this card is theme-neutral; E1 objective / E2 pointable fact / E3 interpretive inference / E4 guess
# Prohibited: place names without documentation, identity guesses, specific theme or project names, long verbatim transcripts
# This card does not constitute legal advice; rights and likeness conclusions must be reviewed by a human.

mdc_version: mdc-v1
material_id: MID-000000000000          # first 12 characters of the sha256, lowercase, generated by fingerprint

identity:                              # all E1, filled automatically by fingerprint / ffprobe
  content_hash: "sha256:"
  hash_mode: sampled                   # sampled | full
  size_bytes: 0
  duration_s: 0.0
  container: ""
  vcodec: ""
  resolution: ""
  fps: ""
  pix_fmt: ""
  acodec: ""
  sample_rate: ""
  channels: 0
  aliases: []
  source_path_hint: ""
  first_registered: "2026-11-10"
  last_verified: "2026-11-10"

content:                               # what it shows
  summary: ""                          # ≤80 characters, complete subject-verb-object, no evaluative wording
  subjects: []                         # people / objects / scene subjects; pointable features only
  actions: []
  timeline:                            # at least 3 anchors; one every 15-30 s for long material
    - tc: "00:00:00.000"
      event: ""
      evidence: E2
  spoken:
    has_speech: unknown                # yes | no | unknown
    language: ""
    key_lines: []                      # key points + timecode only, no long verbatim dialogue
    transcript_ref: ""
  onscreen_text: []                    # {tc, text}
  affordances: []                      # neutral usage tags: empty plate / facial expression / product close-up / action process / ambient atmosphere / data screen / sync sound
  notable_absences: []                 # things explicitly absent; very useful at retrieval time

where:                                 # where it was shot
  setting_type: unknown                # indoor | outdoor | studio | nature | screen_capture | virtual | unknown
  place_name: null                     # must be null without E2 documentation
  place_basis: ""                      # on-screen text / identifiable landmark / EXIF GPS / shooting record / client's written statement
  landmarks: []
  environment:
    time_of_day: unknown
    weather: unknown
    season: unknown
    light_direction: unknown
    light_quality: unknown
    background: ""
    props: []
  camera:
    position: unknown
    angle: unknown
    height: unknown
    movement: unknown
    stability: unknown
  geo_hint: null
  inference_note: ""                   # collect all E3 inferences here: basis + confidence + falsification condition

style:                                 # what it looks like
  genre: unknown                       # documentary/narrative fiction/commercial/screen recording/surveillance/animation/user-generated
  visual:
    shot_sizes: []
    composition: ""
    movement: ""
    stability: ""
    color_palette: []
    contrast: unknown
    saturation: unknown
    white_balance: unknown
    grain: unknown
    era_feel: ""
  measured:                            # E1, from reference_probe.sh / qc_scan.sh
    shot_median_s: 0.0
    cuts_per_min: 0.0
    integrated_lufs: 0.0
    true_peak_dbtp: 0.0
    yavg: 0.0
    satavg: 0.0
  audio:
    music: unknown
    ambience: ""
    sfx: []
    voice: ""
    noise_floor: ""
    has_music_bed: unknown
  mood: []                             # ≤3, each paired with one visual or audio basis
  rhythm: ""
  style_notes:                         # five parts per entry; an entry missing any part is void
    - observation: ""
      basis: ""
      inference: ""
      action: ""
      confidence: ""
  similarity_caveat: ""

usability:                             # whether it can be used
  provenance:
    origin: unknown                    # self_shot | stock | client | archive | ugc | unknown
    acquired_from: ""
    license_ref: ""                    # path to the documentation file; do not embed sensitive information
  rights_status: unknown               # cleared | pending | restricted | blocked | unknown
  rights_expiry: null
  releases:
    portrait: unknown
    minor_guardian: na
    location: unknown
    trademark: na
    music: na
  quality_issues: []                   # {tc, issue}: black frames/silence/shake/soft focus/overexposure/watermark/audio-video desync
  edit_notes:
    best_ranges: []
    avoid_ranges: []
    handles_frames: 12
    continuity_risks: []
  qc_ref: ""
  privacy_flags: []                    # faces/licence plates/house numbers/ID documents/personal information on screens

meta:
  model: ""
  prompt_ref: "templates/model-analysis-prompt.md"
  analyzed_at: "2026-11-10"
  analyst: ""
  card_version: 1
  status: unverified                   # active | superseded | blocked | unverified
  supersedes: null
  corrections: []                      # {ts, field, old, new, basis, signoff}

constraints:
  no_expression_copy: true
  theme_neutrality: true
  no_geo_guess: true
  no_identity_guess: true
  no_use_until_cleared: true           # must be true whenever rights_status is not cleared
